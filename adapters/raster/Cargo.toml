[package]
name = "gazette-adapter-raster"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
description = "Decodes retained PNG and JPEG images to pixels within set limits."

[lints]
workspace = true

[dependencies]
gazette-core.workspace = true
gazette-ports.workspace = true
image = { version = "=0.25.10", default-features = false, features = ["png"] }
jpeg-encoder = { version = "=0.7.1", default-features = false, features = ["std"] }
png = "=0.18.0"
image-webp = "=0.2.4"
flate2 = { version = "=1.1.10", default-features = false, features = ["zlib-rs"] }
zune-core = { version = "=0.5.3", default-features = false, features = ["std"] }
zune-jpeg = { version = "=0.5.16-rc2", default-features = false, features = ["std"] }

[dev-dependencies]
base64.workspace = true
