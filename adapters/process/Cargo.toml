[package]
name = "gazette-adapter-process"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
description = "Runs an external command as a direct child with bounded input and time."

[package.metadata.gazette]
source-inputs = ["social-card.mjs", "social_card"]

[lints]
workspace = true

[dependencies]
gazette-core.workspace = true
gazette-ports.workspace = true
sha2.workspace = true
tempfile.workspace = true

[target.'cfg(unix)'.dependencies]
rtepl-filesystem = { git = "https://github.com/getHarshOnline/rtepl-common.git", rev = "13060ae859f5820efd5641d5145563c8a0e1452e" }
rustix.workspace = true

[target.'cfg(unix)'.dev-dependencies]
rustix = { workspace = true, features = ["process"] }
