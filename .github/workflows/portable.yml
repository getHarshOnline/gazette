name: Portable build

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: portable-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.system }}
    runs-on: ${{ matrix.system }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: ubuntu-24.04
            native_library: libgazette_node.so
          - system: macos-15
            native_library: libgazette_node.dylib
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - name: Check out exact source
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3

      - name: Select exact Node runtime
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22.18.0
          cache: npm
          cache-dependency-path: integrations/vscode/package-lock.json

      - name: Report selected toolchains
        run: |
          rustc --version --verbose
          cargo --version --verbose
          node --version
          npm --version
          git --version
          openssl version
          python3 --version
          curl --version

      - name: Validate release inventory generation
        run: |
          cargo fetch --locked
          python3 -m unittest discover -s tools/tests -p 'test_distribution_evidence.py'
          python3 tools/generate_distribution_evidence.py --output-root "$RUNNER_TEMP/gazette-distribution"
          python3 tools/generate_distribution_evidence.py --check --output-root "$RUNNER_TEMP/gazette-distribution"

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Check isolated Rust SDK feature profiles
        run: |
          cargo check --locked -p gazette-sdk --all-targets --no-default-features
          cargo check --locked -p gazette-sdk --all-targets --no-default-features --features authoring
          cargo check --locked -p gazette-sdk --all-targets --no-default-features --features native-configuration

      - name: Build the standalone application
        run: cargo build --locked --bin gazette

      - name: Compile every Rust target
        run: cargo test --workspace --all-targets --locked --no-run

      - name: Run the portable default Rust suite
        run: |
          GAZETTE_TEST_NODE="$(node --print 'process.execPath')" \
          GAZETTE_TEST_CURL="$(command -v curl)" \
          GAZETTE_TEST_GIT="$(command -v git)" \
          GAZETTE_TEST_OPENSSL="$(command -v openssl)" \
          GAZETTE_TEST_PYTHON="$(command -v python3)" \
          cargo test --workspace --locked --no-fail-fast -- --test-threads=4

      - name: Lint every Rust target
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Build Rust documentation
        run: cargo doc --workspace --locked --no-deps

      - name: Exercise the standalone command
        run: cargo run --locked -- --help

      - name: Exercise the direct publication quickstart
        run: GAZETTE_TEST_GIT="$(command -v git)" sh examples/quickstart/run.sh

      - name: Exercise the persistent first-publication starter
        run: python3 examples/first-publication/check.py --gazette "$PWD/target/debug/gazette"

      - name: Install the locked VS Code development graph
        working-directory: integrations/vscode
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Check the VS Code integration
        working-directory: integrations/vscode
        run: GAZETTE_TEST_GIT="$(command -v git)" npm run check

      - name: Check the native JavaScript SDK
        run: |
          export GAZETTE_TEST_GIT="$(command -v git)"
          cargo build --locked -p gazette-node --lib --examples
          mkdir "$RUNNER_TEMP/gazette-native-sdk"
          node sdk/js/tools/package-addon.mjs \
            "$GITHUB_WORKSPACE/target/debug/${{ matrix.native_library }}" \
            "$RUNNER_TEMP/gazette-native-sdk/gazette.node"
          "$GITHUB_WORKSPACE/target/debug/examples/workspace_reference" \
            > "$RUNNER_TEMP/gazette-native-sdk/workspace-reference.json"
          node sdk/js/tests/native.mjs \
            "$RUNNER_TEMP/gazette-native-sdk/gazette.node" \
            < "$RUNNER_TEMP/gazette-native-sdk/workspace-reference.json"
          node sdk/js/tests/typescript.mjs \
            "$GITHUB_WORKSPACE/integrations/vscode/node_modules/typescript/bin/tsc" \
            "$RUNNER_TEMP/gazette-native-sdk/gazette.node" \
            < "$RUNNER_TEMP/gazette-native-sdk/workspace-reference.json"
          node sdk/js/tests/publication.mjs \
            "$RUNNER_TEMP/gazette-native-sdk/gazette.node" \
            "$GITHUB_WORKSPACE/target/debug/examples/publication_reference"
          node sdk/js/tests/inspection_tree.mjs \
            "$RUNNER_TEMP/gazette-native-sdk/gazette.node" \
            "$GITHUB_WORKSPACE/target/debug/examples/inspection_reference"
          node sdk/js/tests/history.mjs \
            "$RUNNER_TEMP/gazette-native-sdk/gazette.node" \
            "$GITHUB_WORKSPACE/target/debug/examples/history_reference"
          node sdk/js/tests/documentation.mjs \
            "$RUNNER_TEMP/gazette-native-sdk/gazette.node" \
            "$GITHUB_WORKSPACE/target/debug/examples/documentation_reference"
          node sdk/js/tests/preparation.mjs \
            "$RUNNER_TEMP/gazette-native-sdk/gazette.node" \
            "$GITHUB_WORKSPACE/target/debug/examples/preparation_reference"

          GAZETTE_TEST_EXECUTABLE="$GITHUB_WORKSPACE/target/debug/gazette" \
          npm --prefix integrations/vscode run test:live-catalog

          GAZETTE_TEST_NODE="$(node --print 'process.execPath')" \
          GAZETTE_TEST_EXECUTABLE="$GITHUB_WORKSPACE/target/debug/gazette" \
          cargo test --locked -p gazette-launcher --test delivery \
            javascript:: -- --ignored --test-threads=1
          GAZETTE_TEST_NODE="$(node --print 'process.execPath')" \
          GAZETTE_TEST_EXECUTABLE="$GITHUB_WORKSPACE/target/debug/gazette" \
          cargo test --locked -p gazette-launcher --test publication_render \
            js_qualification:: -- --ignored --test-threads=1

      - name: Check the provider-free JavaScript browser SDK
        run: |
          GAZETTE_TEST_TYPESCRIPT="$GITHUB_WORKSPACE/integrations/vscode/node_modules/typescript/lib/typescript.js" \
          node --test sdk/js/tests/search.mjs sdk/js/tests/search-browse.mjs sdk/js/tests/analytics.mjs sdk/js/tests/webmcp.mjs

      - name: Qualify the native Graphviz and Chrome publication providers
        if: runner.os == 'Linux'
        shell: bash
        run: |
          dot="$(command -v dot)"
          chrome="$(command -v google-chrome)"
          test -x "$dot"
          test -x "$chrome"
          "$dot" -V
          "$chrome" --version
          GAZETTE_TEST_DOT="$dot" \
          cargo test --locked -p gazette-launcher --test publication_page_resources \
            diagrams:: -- --ignored --test-threads=1
          GAZETTE_TEST_DOT="$dot" \
          cargo test --locked -p gazette-launcher --test publication_render \
            resource_mounts::mounted_dot -- --ignored --test-threads=1
          GAZETTE_TEST_CHROME="$chrome" \
          cargo test --locked -p gazette-launcher --test publication_render \
            search::browser:: -- --ignored --test-threads=1
          GAZETTE_TEST_CHROME="$chrome" \
          cargo test --locked -p gazette-launcher --test publication_render \
            islands::browser:: -- --ignored --test-threads=1
          GAZETTE_TEST_CHROME="$chrome" \
          cargo test --locked -p gazette-launcher --test publication_render \
            webmcp:: -- --ignored --test-threads=1

  documentation-providers:
    name: ubuntu-24.04 generated documentation
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - name: Check out exact source
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3

      - name: Select exact Python runtime
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.13.7
          cache: pip
          cache-dependency-path: adapters/documentation/tests/providers/sphinx/requirements.txt

      - name: Select exact Node runtime
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22.18.0
          cache: npm
          cache-dependency-path: adapters/documentation/tests/providers/typedoc/package-lock.json

      - name: Select exact Go runtime
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.6
          cache: false

      - name: Provision the hash-locked Sphinx closure
        run: |
          python -m venv --copies "$RUNNER_TEMP/gazette-sphinx"
          "$RUNNER_TEMP/gazette-sphinx/bin/python" -m pip install \
            --disable-pip-version-check \
            --require-hashes \
            --requirement adapters/documentation/tests/providers/sphinx/requirements.txt
          "$RUNNER_TEMP/gazette-sphinx/bin/python" -m pip check

      - name: Provision the integrity-locked TypeDoc closure
        working-directory: adapters/documentation/tests/providers/typedoc
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Provision exact Go documentation generators
        working-directory: adapters/documentation/tests/providers/go
        env:
          GOTOOLCHAIN: local
          CGO_ENABLED: "0"
        run: |
          mkdir -p "$RUNNER_TEMP/gazette-provider-bin"
          go build -mod=readonly -trimpath \
            -o "$RUNNER_TEMP/gazette-provider-bin/gomarkdoc" \
            github.com/princjef/gomarkdoc/cmd/gomarkdoc
          go build -mod=readonly -trimpath \
            -o "$RUNNER_TEMP/gazette-provider-bin/swagger" \
            github.com/go-swagger/go-swagger/cmd/swagger

      - name: Qualify all five native documentation routes
        env:
          GAZETTE_TEST_SPHINX_PYTHON: ${{ runner.temp }}/gazette-sphinx/bin/python
          GAZETTE_TEST_TYPEDOC: ${{ github.workspace }}/adapters/documentation/tests/providers/typedoc/node_modules/typedoc/bin/typedoc
          GAZETTE_TEST_GOMARKDOC: ${{ runner.temp }}/gazette-provider-bin/gomarkdoc
          GAZETTE_TEST_SWAGGER: ${{ runner.temp }}/gazette-provider-bin/swagger
        run: |
          GAZETTE_TEST_CARGO="$(rustup which cargo)" \
          GAZETTE_TEST_RUSTDOC_STABLE="$(rustup which rustdoc)" \
          GAZETTE_TEST_NODE="$(node --print 'process.execPath')" \
          GAZETTE_TEST_GO_ROOT="$(go env GOROOT)" \
          adapters/documentation/tests/qualify-linux-providers.sh
