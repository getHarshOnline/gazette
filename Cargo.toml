# One composition workspace; public entry points share inward application behavior.
[workspace]
resolver = "3"
members = [
    "crates/gazette-core",
    "crates/gazette-ports",
    "crates/gazette-application",
    "crates/gazette-compiler",
    "adapters/fs",
    "adapters/http",
    "adapters/process",
    "adapters/authority",
    "adapters/git",
    "adapters/sqlite",
    "adapters/mintlify",
    "adapters/documentation",
    "adapters/tera",
    "adapters/javascript",
    "adapters/styles",
    "adapters/fonts",
    "adapters/raster",
    "adapters/vector",
    "adapters/markdown",
    "sdk/rust",
    "sdk/js",
    "interfaces/cli",
    "interfaces/launcher",
    "interfaces/mcp",
    "interfaces/lsp",
    "integrations/github",
    "tests/support",
]
default-members = ["interfaces/launcher"]
exclude = ["adapters/styles/vendor/grass_compiler-0.13.4"]

[patch.crates-io]
grass_compiler = { path = "adapters/styles/vendor/grass_compiler-0.13.4" }

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false
license = "AGPL-3.0-or-later"

[workspace.dependencies]
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }
gazette-core = { path = "crates/gazette-core" }
gazette-ports = { path = "crates/gazette-ports" }
gazette-application = { path = "crates/gazette-application" }
gazette-compiler = { path = "crates/gazette-compiler" }
gazette-adapter-fs = { path = "adapters/fs" }
gazette-adapter-http = { path = "adapters/http" }
gazette-adapter-process = { path = "adapters/process" }
gazette-adapter-authority = { path = "adapters/authority" }
gazette-adapter-git = { path = "adapters/git" }
gazette-adapter-sqlite = { path = "adapters/sqlite" }
gazette-adapter-mintlify = { path = "adapters/mintlify" }
gazette-adapter-documentation = { path = "adapters/documentation" }
gazette-adapter-tera = { path = "adapters/tera" }
gazette-adapter-javascript = { path = "adapters/javascript" }
gazette-adapter-styles = { path = "adapters/styles" }
gazette-adapter-fonts = { path = "adapters/fonts" }
gazette-adapter-raster = { path = "adapters/raster" }
gazette-adapter-vector = { path = "adapters/vector" }
gazette-adapter-markdown = { path = "adapters/markdown" }
gazette-sdk = { path = "sdk/rust", default-features = false }
gazette-cli = { path = "interfaces/cli" }
gazette-mcp = { path = "interfaces/mcp" }
gazette-lsp = { path = "interfaces/lsp" }
gazette-integration-github = { path = "integrations/github" }
gazette-test-support = { path = "tests/support" }
napi = { version = "=3.12.2", default-features = false, features = ["napi8"] }
napi-derive = { version = "=3.6.3", default-features = false }
napi-build = "=2.4.1"
clap = { version = "=4.6.6", features = ["derive"] }
rustix = { version = "=1.1.4", features = ["fs"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["arbitrary_precision", "raw_value"] }
schemars = "=1.2.2"
spdx = "=0.13.2"
serde_jcs = "=0.2.0"
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["std"] }
base64 = "=0.22.1"
jsonschema = { version = "=0.49.2", default-features = false, features = ["arbitrary-precision"] }
yaml-rust2 = { version = "=0.11.0", default-features = false }
swagger2openapi = "=0.2.0"
html5ever = "=0.35.0"
cssparser = "=0.33.0"
cssparser-color = "=0.1.0"
quick-xml = { version = "=0.41.0", default-features = false }
xml = "=1.4.0"
oxilangtag = "=0.1.6"
chrono = { version = "=0.4.45", default-features = false, features = ["std"] }
percent-encoding = "=2.3.2"
httparse = "=1.10.1"
url = "=2.5.8"
caseless = "=0.2.2"
unicode-normalization = "=0.1.25"
sha2 = "=0.10.9"
tempfile = "=3.27.0"
getrandom = "=0.4.3"
comrak = { version = "=0.54.0", default-features = false, features = ["attributes"] }
syntect = { version = "=5.3.0", default-features = false, features = ["html", "regex-fancy"] }
two-face = { version = "=0.5.2", default-features = false, features = ["syntect-fancy"] }
slug = "=0.1.6"
toml_edit = { version = "=0.25.13", default-features = false, features = ["parse", "serde"] }
toml_parser = { version = "=1.1.3", default-features = false, features = ["std"] }
tera = { version = "=1.20.1", default-features = false }
swc_core = { version = "=80.0.0", default-features = false, features = ["common", "ecma_ast", "ecma_parser", "ecma_parser_typescript", "ecma_codegen", "ecma_transforms_typescript", "ecma_visit", "bundler", "ecma_loader"] }
anyhow = "=1.0.104"
oxc_allocator = "=0.95.0"
oxc_ast = "=0.95.0"
oxc_parser = "=0.95.0"
oxc_semantic = "=0.95.0"
oxc_span = "=0.95.0"
grass = { version = "=0.13.4", default-features = false }
grass_compiler = { version = "=0.13.4", default-features = false }
lightningcss = { version = "=1.0.0-alpha.70", default-features = false, features = ["visitor"] }
wuff = { version = "=0.2.8", default-features = false, features = ["brotli"] }
read-fonts = { version = "=0.39.2", default-features = false, features = ["std"] }
# Local Git objects only; qualify the bundled library, without SSH/HTTPS.
git2 = { version = "=0.21.0", default-features = false, features = ["vendored-libgit2"] }
# Embedded provider identity is pinned in Cargo.lock; no system SQLite substitution.
rusqlite = { version = "=0.39.0", default-features = false, features = ["bundled", "limits", "hooks", "backup"] }
rusqlite_migration = { version = "=2.5.0", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
unreachable_pub = "deny"

[workspace.lints.clippy]
# Dedicated architecture proof rejects unwrap/unwrap_err in production trees.
# Integration fixtures may use them as concise assertions without making a
# warnings-as-errors workspace run rewrite nearly one thousand test call sites.
unwrap_used = "allow"
# Gazette's typed failures intentionally retain exact process, custody and
# evidence state by value. Boxing is chosen at outer/FFI boundaries instead of
# introducing hidden allocations throughout the native application contract.
result_large_err = "allow"
doc_markdown = "deny"
missing_errors_doc = "deny"
missing_panics_doc = "deny"

[workspace.lints.rustdoc]
bare_urls = "deny"
broken_intra_doc_links = "deny"
invalid_codeblock_attributes = "deny"
invalid_html_tags = "deny"
private_intra_doc_links = "deny"
