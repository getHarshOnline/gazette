[package]
name = "gazette-sdk"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
description = "Gazette's public Rust API over its shared application behavior."

[lints]
workspace = true

[features]
default = []
# Pure selected-buffer inspection and editor analysis. The Markdown adapter owns
# syntax mechanics; inward documentation contracts own route/link projection.
authoring = ["dep:gazette-adapter-markdown"]
# Confined, caller-selected configuration and source capture. This intentionally
# excludes build, deployment, registry and publication-effect adapters.
native-configuration = ["dep:gazette-adapter-fs", "dep:gazette-adapter-git"]
# Complete local application composition for CLI, MCP and the broad Node SDK.
# Enabling it selects implementations; it grants no native permission or effect.
native-local = [
    "authoring",
    "native-configuration",
    "dep:gazette-adapter-http",
    "dep:gazette-adapter-process",
    "dep:gazette-adapter-authority",
    "dep:gazette-adapter-sqlite",
    "dep:gazette-adapter-tera",
    "dep:gazette-adapter-javascript",
    "dep:gazette-adapter-styles",
    "dep:gazette-adapter-raster",
    "dep:gazette-adapter-vector",
    "dep:gazette-adapter-fonts",
    "dep:gazette-adapter-mintlify",
    "dep:gazette-adapter-documentation",
    "dep:gazette-integration-github",
]

[dependencies]
gazette-core.workspace = true
gazette-ports.workspace = true
gazette-application.workspace = true
gazette-compiler.workspace = true
gazette-adapter-fs = { workspace = true, optional = true }
gazette-adapter-http = { workspace = true, optional = true }
gazette-adapter-process = { workspace = true, optional = true }
gazette-adapter-authority = { workspace = true, optional = true }
gazette-adapter-git = { workspace = true, optional = true }
gazette-adapter-sqlite = { workspace = true, optional = true }
gazette-adapter-tera = { workspace = true, optional = true }
gazette-adapter-javascript = { workspace = true, optional = true }
gazette-adapter-styles = { workspace = true, optional = true }
gazette-adapter-raster = { workspace = true, optional = true }
gazette-adapter-vector = { workspace = true, optional = true }
gazette-adapter-fonts = { workspace = true, optional = true }
gazette-adapter-markdown = { workspace = true, optional = true }
gazette-adapter-mintlify = { workspace = true, optional = true }
gazette-adapter-documentation = { workspace = true, optional = true }
gazette-integration-github = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true

[dev-dependencies]
rtepl-repository = { git = "https://github.com/getHarshOnline/rtepl-common.git", rev = "13060ae859f5820efd5641d5145563c8a0e1452e" }
gazette-test-support.workspace = true
git2.workspace = true
jsonschema.workspace = true
tempfile.workspace = true
syn = { version = "=2.0.119", features = ["full", "visit"] }

[[test]]
name = "documentation_materialization"
required-features = ["native-local"]

